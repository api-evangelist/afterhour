aid: afterhour
name: AfterHour
description: 'AfterHour is a social copy-trading and investing community for retail
  investors, founded in 2022 and headquartered in San Francisco. The mobile app lets
  verified traders connect their real brokerage accounts and share live, proven positions
  — more than $300M in live trades every day — so members can follow top traders, copy
  trades, discuss tickers in real-time stock chat rooms, receive alerts, and track
  their own portfolios. AfterHour is backed by Founders Fund and General Catalyst.
  This provider was surfaced as a General Catalyst portfolio company; it publishes a
  consumer app and marketing site but no public developer API at this time.'
